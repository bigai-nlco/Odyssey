<title>WebQA scores, ReAct vs Odyssey, at 4B, 8B and 14B scale</title>
<desc>Grouped bar chart with three model-size groups (4B, 8B, 14B). Each group shows WebQA accuracy for the ReAct base agent (light) and the corresponding RL-trained Odyssey agent (dark), with a short vertical line on each bar showing result variance. Odyssey scores higher than ReAct at every scale.</desc>

<text x="30" y="34" font-size="20" font-weight="500" fill="rgb(11, 11, 11)">WebQA</text>
<text x="30" y="58" font-size="14" fill="rgb(82, 81, 78)">Accuracy averaged by four runs, Base (ReAct) vs. Mixed RL (Odyssey).</text>

<g font-size="14" fill="rgb(137, 135, 129)">
<line x1="55" y1="360" x2="860" y2="360" stroke="#c3c2b7" stroke-width="1"/>
<g stroke="#e1e0d9" stroke-width="1">
<line x1="55" y1="303.3" x2="860" y2="303.3"/>
<line x1="55" y1="246.7" x2="860" y2="246.7"/>
<line x1="55" y1="190.0" x2="860" y2="190.0" mask="url(#webqa-text-gaps)"/>
<line x1="55" y1="133.3" x2="860" y2="133.3" mask="url(#webqa-text-gaps)"/>
<line x1="55" y1="76.7" x2="860" y2="76.7"/>
</g>
